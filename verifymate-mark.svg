    </linearGradient>
    <filter id="brush" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1 0.014" numOctaves="3" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
    </filter>
    <filter id="struck" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="3" dy="4" stdDeviation="2.2" flood-color="#000" flood-opacity="0.80"/>
      <feDropShadow dx="-1.6" dy="-2" stdDeviation="1.2" flood-color="#ffffff" flood-opacity="0.42"/>
    </filter>
    <filter id="struckLite" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="1.8" dy="2.4" stdDeviation="1.3" flood-color="#000" flood-opacity="0.78"/>
      <feDropShadow dx="-1" dy="-1.2" stdDeviation="0.7" flood-color="#ffffff" flood-opacity="0.38"/>
    </filter>
    <filter id="deboss" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="-1.2" dy="-1.4" stdDeviation="0.9" flood-color="#000" flood-opacity="0.85"/>
      <feDropShadow dx="1.2" dy="1.6" stdDeviation="1" flood-color="#ffffff" flood-opacity="0.30"/>
    </filter>
    <filter id="accGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cast" x="-40%" y="-40%" width="180%" height="180%">
