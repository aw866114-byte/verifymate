  <defs>
    <linearGradient id="steel" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f6f8fb"/><stop offset="0.24" stop-color="#c8ced7"/><stop offset="0.5" stop-color="#878d97"/><stop offset="0.76" stop-color="#ced4dc"/><stop offset="1" stop-color="#5f646c"/>
    </linearGradient>
    <linearGradient id="steelType" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cfd5de"/><stop offset="0.55" stop-color="#7e838c"/><stop offset="1" stop-color="#d6dbe3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fff0bd"/><stop offset="0.32" stop-color="#ffd15c"/><stop offset="0.68" stop-color="#dc9f24"/><stop offset="1" stop-color="#8e6320"/>
